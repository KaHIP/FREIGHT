<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <!-- Glow filter for nodes -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Soft shadow for partition blocks -->
    <filter id="blockShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="shadow"/>
      <feOffset dx="0" dy="3" in="shadow" result="shadowOffset"/>
      <feFlood flood-color="#000" flood-opacity="0.4" result="shadowColor"/>
      <feComposite in="shadowColor" in2="shadowOffset" operator="in" result="shadowFinal"/>
      <feMerge>
        <feMergeNode in="shadowFinal"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Badge glow -->
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="#1a1d23"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04">
    <line x1="0" y1="0" x2="0" y2="640" stroke="#fff" stroke-width="0.5" transform="translate(40,0)"/>
    <line x1="0" y1="0" x2="0" y2="640" stroke="#fff" stroke-width="0.5" transform="translate(80,0)"/>
    <line x1="0" y1="0" x2="0" y2="640" stroke="#fff" stroke-width="0.5" transform="translate(120,0)"/>
    <line x1="0" y1="0" x2="0" y2="640" stroke="#fff" stroke-width="0.5" transform="translate(160,0)"/>
    <line x1="0" y1="0" x2="0" y2="640" stroke="#fff" stroke-width="0.5" transform="translate(200,0)"/>
    <line x1="0" y1="0" x2="0" y2="640" stroke="#fff" stroke-width="0.5" transform="translate(240,0)"/>
    <line x1="0" y1="0" x2="0" y2="640" stroke="#fff" stroke-width="0.5" transform="translate(280,0)"/>
    <line x1="0" y1="0" x2="0" y2="640" stroke="#fff" stroke-width="0.5" transform="translate(320,0)"/>
    <line x1="0" y1="0" x2="0" y2="640" stroke="#fff" stroke-width="0.5" transform="translate(360,0)"/>
    <line x1="0" y1="0" x2="0" y2="640" stroke="#fff" stroke-width="0.5" transform="translate(400,0)"/>
    <line x1="0" y1="0" x2="0" y2="640" stroke="#fff" stroke-width="0.5" transform="translate(440,0)"/>
    <line x1="0" y1="0" x2="0" y2="640" stroke="#fff" stroke-width="0.5" transform="translate(480,0)"/>
    <line x1="0" y1="0" x2="0" y2="640" stroke="#fff" stroke-width="0.5" transform="translate(520,0)"/>
    <line x1="0" y1="0" x2="0" y2="640" stroke="#fff" stroke-width="0.5" transform="translate(560,0)"/>
    <line x1="0" y1="0" x2="1280" y2="0" stroke="#fff" stroke-width="0.5" transform="translate(0,40)"/>
    <line x1="0" y1="0" x2="1280" y2="0" stroke="#fff" stroke-width="0.5" transform="translate(0,80)"/>
    <line x1="0" y1="0" x2="1280" y2="0" stroke="#fff" stroke-width="0.5" transform="translate(0,120)"/>
    <line x1="0" y1="0" x2="1280" y2="0" stroke="#fff" stroke-width="0.5" transform="translate(0,160)"/>
    <line x1="0" y1="0" x2="1280" y2="0" stroke="#fff" stroke-width="0.5" transform="translate(0,200)"/>
    <line x1="0" y1="0" x2="1280" y2="0" stroke="#fff" stroke-width="0.5" transform="translate(0,240)"/>
    <line x1="0" y1="0" x2="1280" y2="0" stroke="#fff" stroke-width="0.5" transform="translate(0,280)"/>
    <line x1="0" y1="0" x2="1280" y2="0" stroke="#fff" stroke-width="0.5" transform="translate(0,320)"/>
    <line x1="0" y1="0" x2="1280" y2="0" stroke="#fff" stroke-width="0.5" transform="translate(0,360)"/>
    <line x1="0" y1="0" x2="1280" y2="0" stroke="#fff" stroke-width="0.5" transform="translate(0,400)"/>
    <line x1="0" y1="0" x2="1280" y2="0" stroke="#fff" stroke-width="0.5" transform="translate(0,440)"/>
    <line x1="0" y1="0" x2="1280" y2="0" stroke="#fff" stroke-width="0.5" transform="translate(0,480)"/>
    <line x1="0" y1="0" x2="1280" y2="0" stroke="#fff" stroke-width="0.5" transform="translate(0,520)"/>
    <line x1="0" y1="0" x2="1280" y2="0" stroke="#fff" stroke-width="0.5" transform="translate(0,560)"/>
    <line x1="0" y1="0" x2="1280" y2="0" stroke="#fff" stroke-width="0.5" transform="translate(0,600)"/>
  </g>

  <!-- ==================== LEFT SIDE: VISUALIZATION (~580px) ==================== -->

  <!-- Streaming nodes: small gray dots growing in size and opacity, flowing right -->
  <!-- Row 1 (upper stream) -->
  <circle cx="30" cy="295" r="2" fill="#888" opacity="0.15" filter="url(#glow)"/>
  <circle cx="55" cy="300" r="2.5" fill="#999" opacity="0.2" filter="url(#glow)"/>
  <circle cx="80" cy="292" r="3" fill="#aaa" opacity="0.25" filter="url(#glow)"/>
  <circle cx="108" cy="298" r="3" fill="#aaa" opacity="0.3" filter="url(#glow)"/>
  <circle cx="135" cy="290" r="3.5" fill="#bbb" opacity="0.35" filter="url(#glow)"/>
  <circle cx="160" cy="296" r="3.5" fill="#bbb" opacity="0.4" filter="url(#glow)"/>
  <circle cx="185" cy="288" r="4" fill="#ccc" opacity="0.45" filter="url(#glow)"/>
  <circle cx="212" cy="294" r="4" fill="#ccc" opacity="0.5" filter="url(#glow)"/>
  <circle cx="240" cy="302" r="4.5" fill="#ddd" opacity="0.55" filter="url(#glow)"/>
  <circle cx="268" cy="292" r="4.5" fill="#ddd" opacity="0.6" filter="url(#glow)"/>

  <!-- Row 2 (middle stream) -->
  <circle cx="40" cy="320" r="2" fill="#888" opacity="0.15" filter="url(#glow)"/>
  <circle cx="65" cy="325" r="2.5" fill="#999" opacity="0.2" filter="url(#glow)"/>
  <circle cx="92" cy="318" r="3" fill="#aaa" opacity="0.28" filter="url(#glow)"/>
  <circle cx="118" cy="322" r="3" fill="#aaa" opacity="0.33" filter="url(#glow)"/>
  <circle cx="145" cy="316" r="3.5" fill="#bbb" opacity="0.38" filter="url(#glow)"/>
  <circle cx="172" cy="324" r="3.5" fill="#bbb" opacity="0.43" filter="url(#glow)"/>
  <circle cx="200" cy="318" r="4" fill="#ccc" opacity="0.48" filter="url(#glow)"/>
  <circle cx="228" cy="326" r="4" fill="#ccc" opacity="0.53" filter="url(#glow)"/>
  <circle cx="255" cy="320" r="4.5" fill="#ddd" opacity="0.58" filter="url(#glow)"/>
  <circle cx="280" cy="316" r="4.5" fill="#ddd" opacity="0.63" filter="url(#glow)"/>

  <!-- Row 3 (lower stream) -->
  <circle cx="35" cy="345" r="2" fill="#888" opacity="0.15" filter="url(#glow)"/>
  <circle cx="60" cy="350" r="2.5" fill="#999" opacity="0.2" filter="url(#glow)"/>
  <circle cx="88" cy="342" r="3" fill="#aaa" opacity="0.26" filter="url(#glow)"/>
  <circle cx="115" cy="348" r="3" fill="#aaa" opacity="0.32" filter="url(#glow)"/>
  <circle cx="140" cy="340" r="3.5" fill="#bbb" opacity="0.37" filter="url(#glow)"/>
  <circle cx="168" cy="346" r="3.5" fill="#bbb" opacity="0.42" filter="url(#glow)"/>
  <circle cx="195" cy="350" r="4" fill="#ccc" opacity="0.47" filter="url(#glow)"/>
  <circle cx="222" cy="342" r="4" fill="#ccc" opacity="0.52" filter="url(#glow)"/>
  <circle cx="250" cy="348" r="4.5" fill="#ddd" opacity="0.57" filter="url(#glow)"/>
  <circle cx="275" cy="340" r="5" fill="#eee" opacity="0.65" filter="url(#glow)"/>

  <!-- Convergence point -->
  <circle cx="310" cy="320" r="6" fill="#fff" opacity="0.7" filter="url(#glow)"/>

  <!-- Branching dashed arrows from convergence to partition blocks -->
  <!-- Arrow to top block (red) -->
  <path d="M 316,314 C 340,290 360,220 385,165" stroke="#e74c3c" stroke-width="2" stroke-dasharray="6,4" fill="none" opacity="0.7"/>
  <polygon points="382,158 390,165 382,172" fill="#e74c3c" opacity="0.7"/>

  <!-- Arrow to middle block (blue) -->
  <path d="M 318,320 L 385,320" stroke="#3498db" stroke-width="2" stroke-dasharray="6,4" fill="none" opacity="0.7"/>
  <polygon points="382,313 390,320 382,327" fill="#3498db" opacity="0.7"/>

  <!-- Arrow to bottom block (amber) -->
  <path d="M 316,326 C 340,350 360,420 385,475" stroke="#f1c40f" stroke-width="2" stroke-dasharray="6,4" fill="none" opacity="0.7"/>
  <polygon points="382,468 390,475 382,482" fill="#f1c40f" opacity="0.7"/>

  <!-- ==================== PARTITION BLOCK 1: RED (#e74c3c) ==================== -->
  <g filter="url(#blockShadow)">
    <rect x="395" y="95" width="195" height="145" rx="12" ry="12" fill="#e74c3c" opacity="0.15" stroke="#e74c3c" stroke-width="1.5"/>

    <!-- Nodes inside red block -->
    <circle cx="430" cy="130" r="5" fill="#e74c3c" opacity="0.9"/>
    <circle cx="470" cy="145" r="5" fill="#e74c3c" opacity="0.9"/>
    <circle cx="510" cy="125" r="5" fill="#e74c3c" opacity="0.9"/>
    <circle cx="545" cy="150" r="5" fill="#e74c3c" opacity="0.9"/>
    <circle cx="450" cy="175" r="5" fill="#e74c3c" opacity="0.9"/>
    <circle cx="500" cy="190" r="5" fill="#e74c3c" opacity="0.9"/>
    <circle cx="540" cy="180" r="5" fill="#e74c3c" opacity="0.9"/>
    <circle cx="560" cy="210" r="5" fill="#e74c3c" opacity="0.9"/>

    <!-- Hyperedge curves inside red block -->
    <path d="M 430,130 C 445,110 460,115 470,145" stroke="#e74c3c" stroke-width="1.2" fill="none" opacity="0.5"/>
    <path d="M 470,145 C 490,130 500,120 510,125" stroke="#e74c3c" stroke-width="1.2" fill="none" opacity="0.5"/>
    <path d="M 510,125 C 530,135 540,140 545,150" stroke="#e74c3c" stroke-width="1.2" fill="none" opacity="0.5"/>
    <path d="M 450,175 C 475,165 490,180 500,190" stroke="#e74c3c" stroke-width="1.2" fill="none" opacity="0.5"/>
    <path d="M 500,190 C 520,185 530,175 540,180" stroke="#e74c3c" stroke-width="1.2" fill="none" opacity="0.5"/>
    <path d="M 540,180 C 550,195 555,205 560,210" stroke="#e74c3c" stroke-width="1.2" fill="none" opacity="0.5"/>
    <!-- Cross-connecting hyperedge -->
    <path d="M 430,130 C 440,160 445,170 450,175" stroke="#e74c3c" stroke-width="1" fill="none" opacity="0.35" stroke-dasharray="3,3"/>
    <path d="M 545,150 C 550,170 555,180 540,180" stroke="#e74c3c" stroke-width="1" fill="none" opacity="0.35" stroke-dasharray="3,3"/>
  </g>

  <!-- ==================== PARTITION BLOCK 2: BLUE (#3498db) ==================== -->
  <g filter="url(#blockShadow)">
    <rect x="395" y="255" width="195" height="145" rx="12" ry="12" fill="#3498db" opacity="0.15" stroke="#3498db" stroke-width="1.5"/>

    <!-- Nodes inside blue block -->
    <circle cx="425" cy="290" r="5" fill="#3498db" opacity="0.9"/>
    <circle cx="465" cy="305" r="5" fill="#3498db" opacity="0.9"/>
    <circle cx="505" cy="285" r="5" fill="#3498db" opacity="0.9"/>
    <circle cx="550" cy="300" r="5" fill="#3498db" opacity="0.9"/>
    <circle cx="440" cy="340" r="5" fill="#3498db" opacity="0.9"/>
    <circle cx="490" cy="355" r="5" fill="#3498db" opacity="0.9"/>
    <circle cx="530" cy="340" r="5" fill="#3498db" opacity="0.9"/>
    <circle cx="565" cy="365" r="5" fill="#3498db" opacity="0.9"/>

    <!-- Hyperedge curves inside blue block -->
    <path d="M 425,290 C 445,275 455,280 465,305" stroke="#3498db" stroke-width="1.2" fill="none" opacity="0.5"/>
    <path d="M 465,305 C 485,290 495,280 505,285" stroke="#3498db" stroke-width="1.2" fill="none" opacity="0.5"/>
    <path d="M 505,285 C 530,290 540,295 550,300" stroke="#3498db" stroke-width="1.2" fill="none" opacity="0.5"/>
    <path d="M 440,340 C 465,330 480,345 490,355" stroke="#3498db" stroke-width="1.2" fill="none" opacity="0.5"/>
    <path d="M 490,355 C 510,345 520,335 530,340" stroke="#3498db" stroke-width="1.2" fill="none" opacity="0.5"/>
    <path d="M 530,340 C 548,355 558,360 565,365" stroke="#3498db" stroke-width="1.2" fill="none" opacity="0.5"/>
    <!-- Cross-connecting hyperedge -->
    <path d="M 425,290 C 432,320 436,330 440,340" stroke="#3498db" stroke-width="1" fill="none" opacity="0.35" stroke-dasharray="3,3"/>
    <path d="M 550,300 C 545,320 535,330 530,340" stroke="#3498db" stroke-width="1" fill="none" opacity="0.35" stroke-dasharray="3,3"/>
  </g>

  <!-- ==================== PARTITION BLOCK 3: AMBER (#f1c40f) ==================== -->
  <g filter="url(#blockShadow)">
    <rect x="395" y="415" width="195" height="145" rx="12" ry="12" fill="#f1c40f" opacity="0.15" stroke="#f1c40f" stroke-width="1.5"/>

    <!-- Nodes inside amber block -->
    <circle cx="430" cy="450" r="5" fill="#f1c40f" opacity="0.9"/>
    <circle cx="470" cy="465" r="5" fill="#f1c40f" opacity="0.9"/>
    <circle cx="510" cy="445" r="5" fill="#f1c40f" opacity="0.9"/>
    <circle cx="550" cy="460" r="5" fill="#f1c40f" opacity="0.9"/>
    <circle cx="445" cy="500" r="5" fill="#f1c40f" opacity="0.9"/>
    <circle cx="495" cy="515" r="5" fill="#f1c40f" opacity="0.9"/>
    <circle cx="535" cy="500" r="5" fill="#f1c40f" opacity="0.9"/>
    <circle cx="560" cy="530" r="5" fill="#f1c40f" opacity="0.9"/>

    <!-- Hyperedge curves inside amber block -->
    <path d="M 430,450 C 450,435 460,440 470,465" stroke="#f1c40f" stroke-width="1.2" fill="none" opacity="0.5"/>
    <path d="M 470,465 C 490,450 500,440 510,445" stroke="#f1c40f" stroke-width="1.2" fill="none" opacity="0.5"/>
    <path d="M 510,445 C 530,450 540,455 550,460" stroke="#f1c40f" stroke-width="1.2" fill="none" opacity="0.5"/>
    <path d="M 445,500 C 470,490 485,505 495,515" stroke="#f1c40f" stroke-width="1.2" fill="none" opacity="0.5"/>
    <path d="M 495,515 C 515,505 525,495 535,500" stroke="#f1c40f" stroke-width="1.2" fill="none" opacity="0.5"/>
    <path d="M 535,500 C 548,515 555,525 560,530" stroke="#f1c40f" stroke-width="1.2" fill="none" opacity="0.5"/>
    <!-- Cross-connecting hyperedge -->
    <path d="M 430,450 C 437,480 441,490 445,500" stroke="#f1c40f" stroke-width="1" fill="none" opacity="0.35" stroke-dasharray="3,3"/>
    <path d="M 550,460 C 545,480 540,490 535,500" stroke="#f1c40f" stroke-width="1" fill="none" opacity="0.35" stroke-dasharray="3,3"/>
  </g>

  <!-- ==================== RIGHT SIDE: TEXT ==================== -->

  <!-- Title: FREIGHT -->
  <text x="690" y="220" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="800" fill="#ffffff" letter-spacing="4">FREIGHT</text>

  <!-- Subtitle -->
  <text x="690" y="268" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#a0a8b4">Fast Streaming Hypergraph Partitioning</text>

  <!-- Divider line -->
  <line x1="690" y1="290" x2="1100" y2="290" stroke="#2d3240" stroke-width="1.5"/>

  <!-- Tagline -->
  <text x="690" y="330" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="300" fill="#7a8290">Partition large hypergraphs in a single pass</text>
  <text x="690" y="355" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="300" fill="#7a8290">with high quality and minimal memory</text>

  <!-- SEA 2023 Best Paper Badge -->
  <g transform="translate(690, 390)">
    <rect x="0" y="0" width="240" height="42" rx="8" ry="8" fill="#f1c40f" opacity="0.12" stroke="#f1c40f" stroke-width="1.2"/>
    <!-- Star icon -->
    <polygon points="22,12 25,20 33,20 27,25 29,33 22,28 15,33 17,25 11,20 19,20" fill="#f1c40f" opacity="0.9"/>
    <text x="42" y="27" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#f1c40f">SEA 2023 Best Paper</text>
  </g>

  <!-- Part of KaHIP badge -->
  <g transform="translate(690, 446)">
    <rect x="0" y="0" width="160" height="36" rx="8" ry="8" fill="#3498db" opacity="0.1" stroke="#3498db" stroke-width="1"/>
    <text x="16" y="24" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#3498db">Part of KaHIP</text>
  </g>

  <!-- Bottom accent: thin colored bar -->
  <rect x="0" y="630" width="427" height="10" fill="#e74c3c" opacity="0.8"/>
  <rect x="427" y="630" width="427" height="10" fill="#3498db" opacity="0.8"/>
  <rect x="854" y="630" width="426" height="10" fill="#f1c40f" opacity="0.8"/>

</svg>